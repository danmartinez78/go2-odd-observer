# Alternative pytest config for isolated test execution
# Install: pip install pytest-xdist
# Usage: pytest -c tests/evaluation/toy_examples/pytest_isolated.ini tests/evaluation/toy_examples/

[pytest]
# Run each test in a separate worker process (clean event loop each time)
addopts = -n auto --dist=loadfile

# Async config
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    slow: marks tests as slow (LLM judging, deselect with '-m "not slow"')
